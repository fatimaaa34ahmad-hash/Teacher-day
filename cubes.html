<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise Cubes!</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            overflow: hidden;
            font-family: 'Kalam', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        h1 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            font-size: 3rem;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.8);
            text-align: center;
            opacity: 0;
            animation: fadeInText 2s ease-in 2s forwards;
            transition: top 2s ease-in-out, transform 2s ease-in-out;
        }

        h1.move-up {
            top: 15%;
            transform: translate(-50%, 0);
        }

        .rose-container {
            position: absolute;
            bottom: -300px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 180px;
            z-index: 60;
            transition: bottom 2.5s cubic-bezier(0.25, 1, 0.5, 1);
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        .rose-container.show {
            bottom: 25%;
        }

        @keyframes fadeInText {
            to { opacity: 1; }
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 1.2rem;
            z-index: 200;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        #cubes-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
            perspective: 1200px;
        }

        .cube-wrapper {
            position: absolute;
            bottom: -150px;
            width: 70px; height: 70px;
            transform-style: preserve-3d;
            animation: jumpCube var(--dur) cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .cube-inner {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: spinCube var(--spin-dur) infinite linear;
        }

        .cube-face {
            position: absolute;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
        }

        .face-front  { transform: translateZ(35px); }
        .face-back   { transform: rotateY(180deg) translateZ(35px); }
        .face-right  { transform: rotateY(90deg) translateZ(35px); }
        .face-left   { transform: rotateY(-90deg) translateZ(35px); }
        .face-top    { transform: rotateX(90deg) translateZ(35px); }
        .face-bottom { transform: rotateX(-90deg) translateZ(35px); }

        @keyframes jumpCube {
            0% {
                transform: translateY(0) translateX(0) scale(0.2) translateZ(0);
                opacity: 1;
            }
            30% {
                transform: translateY(calc(-60vh - var(--h))) translateX(var(--x)) scale(1.5) translateZ(var(--z));
            }
            100% {
                transform: translateY(110vh) translateX(calc(var(--x) * 2)) scale(1) translateZ(calc(var(--z) * 2));
                opacity: 0;
            }
        }
        
        @keyframes spinCube {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(720deg) rotateZ(360deg); }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">&larr; Go Back</a>
    
    <h1 id="main-text">Happy Teacher's Day! 🎉</h1>
    <div class="rose-container" id="rose">🌹</div>

    <div id="cubes-container"></div>

    <script>
        const container = document.getElementById('cubes-container');
        
        // List of uploaded images
        const images = [
            "assets/muhammad-suheer-CUPksBEa.webp",
            "assets/Screenshot%202026-08-31%20102311.png",
            "assets/Screenshot%202026-08-31%20102356.png",
            "assets/Screenshot%202026-10-03%20201537.png"
        ];
        
        function createCube() {
            const wrapper = document.createElement('div');
            wrapper.className = 'cube-wrapper';
            
            // Random positioning and physics
            const left = Math.random() * 100; // start anywhere horizontally
            const xDir = (Math.random() - 0.5) * 800; // scatter wide
            const zDir = (Math.random() - 0.5) * 600; // depth scatter
            const hAdd = Math.random() * 500; // height randomizer
            const dur = 3 + Math.random() * 3; // duration 3s to 6s
            const spinDur = 1 + Math.random() * 3; // spin 1s to 4s
            const delay = Math.random() * 1.5; // slight stagger up to 1.5s
            
            wrapper.style.left = `${left}vw`;
            wrapper.style.setProperty('--x', `${xDir}px`);
            wrapper.style.setProperty('--z', `${zDir}px`);
            wrapper.style.setProperty('--h', `${hAdd}px`);
            wrapper.style.setProperty('--dur', `${dur}s`);
            wrapper.style.animationDelay = `${delay}s`;
            
            // Hide initially until animation starts
            wrapper.style.opacity = '0';
            setTimeout(() => { wrapper.style.opacity = '1'; }, delay * 1000);
            
            const inner = document.createElement('div');
            inner.className = 'cube-inner';
            inner.style.setProperty('--spin-dur', `${spinDur}s`);
            
            // Pick a random image for this entire cube
            const randomImg = images[Math.floor(Math.random() * images.length)];
            
            ['front','back','right','left','top','bottom'].forEach(face => {
                const div = document.createElement('div');
                div.className = `cube-face face-${face}`;
                div.style.backgroundImage = `url('${randomImg}')`;
                inner.appendChild(div);
            });
            
            wrapper.appendChild(inner);
            container.appendChild(wrapper);
        }

        window.onload = () => {
            // First burst
            for(let i=0; i<80; i++) {
                createCube();
            }
            // After cubes finish (around 5.5s), move text up and show rose
            setTimeout(() => {
                document.getElementById('main-text').classList.add('move-up');
                document.getElementById('rose').classList.add('show');
            }, 5500);
        };
    </script>
</body>
</html>
